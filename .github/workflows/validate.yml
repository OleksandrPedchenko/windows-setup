name: Validate

on:
  push:
  pull_request:

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts and validate JSON
        shell: pwsh
        run: ./validate.ps1
      - name: Test Google Drive file handling with a stub response
        shell: pwsh
        run: ./tests/google-drive.ps1
      - name: Test encrypted configuration
        shell: pwsh
        run: ./tests/encrypted-config.ps1
      - name: Test check-only mode
        shell: pwsh
        run: ./tests/check-only.ps1
