name: Validate

on:
  push:
  pull_request:

jobs:
  toolkit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run toolkit -- validate
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts and validate JSON
        shell: pwsh
        run: ./validate.ps1
      - name: Test Google Drive file handling with a local fixture
        shell: pwsh
        run: ./tests/google-drive.ps1
      - name: Test encrypted configuration
        shell: pwsh
        run: ./tests/encrypted-config.ps1
      - name: Test check-only mode
        shell: pwsh
        run: ./tests/check-only.ps1
      - name: Test WinGet installer-only output
        shell: pwsh
        run: ./tests/winget-download.ps1
      - name: Test interactive package selection
        shell: pwsh
        run: ./tests/package-selection.ps1
      - name: Test remote invocation paths
        shell: pwsh
        run: ./tests/remote-invocation.ps1
